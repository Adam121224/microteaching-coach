<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>微格师范生试讲陪练工作台</title>
<style>
  :root{
    --bg:#f3efe7; --bg2:#ece5d8; --card:#ffffff; --ink:#23201b; --ink-soft:#6b6359;
    --line:#e4ddcf; --line-strong:#d8cfbd;
    --primary:#9c6b3f; --primary-d:#7c5230; --primary-soft:#f4ece1;
    --ok:#5f7d4f; --warn:#b07d2b; --bad:#b14a3a;
    --xiaoyu:#bd7a5e; --zihan:#6f8b66; --haoran:#c59a3c; --siqi:#8a6f9c;
    --shadow:0 18px 48px rgba(60,48,30,.10); --shadow-sm:0 2px 12px rgba(60,48,30,.06);
    --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:
      radial-gradient(1200px 600px at 80% -10%, #fbf7ef 0%, rgba(251,247,239,0) 60%),
      radial-gradient(1000px 500px at -10% 110%, #efe7d8 0%, rgba(239,231,216,0) 55%),
      var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    font-size:15px;line-height:1.65;letter-spacing:.2px;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;}
  .topbar .logo{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink);letter-spacing:1px;}
  .topbar .logo .mk{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--primary);margin-right:9px;vertical-align:middle;box-shadow:0 0 0 4px var(--primary-soft);}
  .topbar .sub{color:var(--ink-soft);font-size:13px;}
  .topbar .spacer{flex:1;}
  .btn{cursor:pointer;border:none;border-radius:11px;padding:11px 20px;font-size:14px;font-weight:600;
    background:var(--primary);color:#fff;transition:.18s;font-family:inherit;letter-spacing:.5px;
    box-shadow:0 6px 16px rgba(124,82,48,.22);}
  .btn:hover{background:var(--primary-d);transform:translateY(-1px);}
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary);box-shadow:none;}
  .btn.ghost:hover{background:var(--primary-soft);}
  .btn.soft{background:var(--primary-soft);color:var(--primary);box-shadow:none;}
  .btn.soft:hover{background:#ece0cf;}
  .btn.sm{padding:7px 14px;font-size:13px;}
  .btn.mic-on{background:var(--bad);border-color:var(--bad);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(177,74,58,.5);}70%{box-shadow:0 0 0 9px rgba(177,74,58,0);}100%{box-shadow:0 0 0 0 rgba(177,74,58,0);}}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 26px;margin-bottom:20px;box-shadow:var(--shadow);}
  .card h2{font-family:var(--serif);margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:.5px;}
  .lead{color:var(--ink-soft);margin:0 0 18px;font-size:14px;}
  .section-title{font-family:var(--serif);font-weight:700;margin:0 0 16px;font-size:19px;
    padding-bottom:10px;border-bottom:1px solid var(--line);letter-spacing:.5px;}
  .section-title::before{content:"";display:inline-block;width:6px;height:18px;border-radius:3px;
    background:var(--primary);margin-right:10px;vertical-align:-3px;}
  .field{margin-bottom:18px;}
  .field > label{display:block;font-weight:600;margin-bottom:9px;font-size:14px;color:var(--ink);}
  .opts{display:flex;flex-wrap:wrap;gap:11px;}
  .opt{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 16px;
    background:#fff;font-size:14px;user-select:none;transition:.14s;color:var(--ink);}
  .opt:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);}
  .opt.sel{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 6px 16px rgba(124,82,48,.22);}
  .opt .k{opacity:.7;font-size:12px;margin-left:4px;}
  input.txt,textarea.txt{width:100%;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:14px;font-family:inherit;background:#fffdf9;color:var(--ink);transition:.15s;}
  textarea.txt{resize:vertical;min-height:64px;}
  textarea.txt.listening{border-color:var(--bad)!important;box-shadow:0 0 0 3px rgba(177,74,58,.16);}
  input.txt:focus,textarea.txt:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .hidden{display:none!important;}
  .scn-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-soft);
    background:linear-gradient(180deg,#fbf6ee,#f6efe2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;}
  .scn-bar b{color:var(--ink);font-weight:600;}
  .scn-bar .tag{background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 12px;color:var(--ink);}
  .chat{border:1px solid var(--line);border-radius:16px;background:
      linear-gradient(180deg,#fbf8f2,#f6f1e8);padding:22px;
    min-height:62vh;max-height:72vh;overflow-y:auto;margin-bottom:14px;box-shadow:inset 0 1px 0 #fff;}
  .row{display:flex;margin:14px 0;gap:12px;align-items:flex-end;}
  .row.teacher{flex-direction:row-reverse;}
  .avatar{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:15px;font-weight:700;font-family:var(--serif);
    box-shadow:0 4px 10px rgba(60,48,30,.18);}
  .bubble{max-width:72%;padding:13px 17px;border-radius:16px;font-size:15.5px;white-space:pre-wrap;line-height:1.6;
    box-shadow:var(--shadow-sm);}
  .row.teacher .bubble{background:linear-gradient(180deg,#2c2820,#231f18);color:#fbf7ef;border-bottom-right-radius:5px;}
  .row.student .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;}
  .who{font-size:12px;color:var(--ink-soft);margin-bottom:3px;font-weight:600;}
  .sys{text-align:center;color:var(--ink-soft);font-size:12.5px;margin:8px 0;font-style:italic;
    background:#fff7ec;border:1px dashed var(--line-strong);border-radius:20px;padding:4px 14px;display:inline-block;width:auto;margin-left:50%;transform:translateX(-50%);}
  .compose{display:flex;gap:12px;align-items:flex-end;}
  .ppt-bar{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fbf6ee,#f6efe2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin-bottom:12px;font-size:13px;}
  .ppt-bar .ppt-ico{font-size:17px;}
  .ppt-bar .ppt-label{font-family:var(--serif);font-weight:700;color:var(--primary);letter-spacing:.5px;}
  .ppt-bar .ppt-page{font-weight:700;color:var(--ink);}
  .ppt-bar .ppt-name{margin-left:auto;color:var(--ink-soft);font-size:12px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ppt-nav{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 11px;font-size:13px;font-family:inherit;color:var(--ink);}
  .ppt-nav:hover{border-color:var(--primary);background:var(--primary-soft);}
  .compose textarea{flex:1;font-size:15px;min-height:58px;}
  .roll-panel{display:flex;flex-wrap:wrap;gap:10px;margin:0;align-items:center;}
  .roll-panel .lbl{font-size:13.5px;color:var(--ink-soft);margin-right:2px;font-weight:600;}
  .stu-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 15px;
    cursor:pointer;font-size:14px;font-family:inherit;transition:.14s;display:flex;align-items:center;gap:7px;}
  .stu-btn::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,#999);}
  .stu-btn:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;user-select:none;}
  .toggle input{width:16px;height:16px;accent-color:var(--primary);}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
  .metric{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:14.5px;}
  .metric:last-child{border-bottom:none;}
  .metric b{color:var(--primary);font-family:var(--serif);font-size:16px;}
  .rubric-item{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;background:#fffdf9;}
  .rubric-item .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .rubric-item .rh b{font-family:var(--serif);font-size:15.5px;}
  .bar{height:9px;background:var(--primary-soft);border-radius:6px;overflow:hidden;margin:8px 0;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--haoran));}
  .note{font-size:13.5px;color:var(--ink-soft);line-height:1.6;}
  .cov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0;}
  .cov{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;display:flex;
    align-items:center;gap:9px;cursor:pointer;background:#fff;transition:.14s;}
  .cov:hover{border-color:var(--primary);}
  .cov.on{border-color:var(--ok);background:#f1f6ec;}
  .cov .dot{width:15px;height:15px;border-radius:5px;border:1px solid var(--line);}
  .cov.on .dot{background:var(--ok);border-color:var(--ok);}
  .pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12.5px;font-weight:600;}
  .pill.ok{background:#eef4e8;color:var(--ok);}
  .pill.warn{background:#f7efdc;color:var(--warn);}
  .pill.bad{background:#f7e9e6;color:var(--bad);}
  .foot{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:28px;}
  .disc{background:#fbf4e8;border:1px solid #ecdcc0;border-radius:12px;padding:13px 16px;
    font-size:13px;color:#8a6d3b;margin-top:12px;line-height:1.6;}
  .banner{background:#f7e9e6;border:1px solid #e6c4bc;color:#a3402f;padding:11px 18px;font-size:13.5px;
    border-radius:12px;margin-bottom:16px;}
  .banner.ok{background:#eef4e8;border-color:#cfe0c2;color:#4f7d3f;}
  .phase-step{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
  .phase-step .dot{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--serif);}
  .phase-step .dot.done{background:var(--ok);color:#fff;}
  .phase-step .dot.cur{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-soft);}
  .overlay{position:fixed;inset:0;background:rgba(35,32,27,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;}
  .overlay .box{background:#fff;border-radius:18px;padding:30px 32px;width:360px;max-width:90vw;box-shadow:var(--shadow);}
  .overlay h3{font-family:var(--serif);margin:0 0 8px;color:var(--ink);font-size:20px;}

  /* ---------- 课堂双栏布局：左大交互区 + 右侧信息栏 ---------- */
  .class-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start;}
  .class-grid .main{min-width:0;}
  .side{display:flex;flex-direction:column;gap:20px;}
  .side .card{margin-bottom:0;padding:20px 22px;}
  .side .scn-bar{flex-direction:column;align-items:flex-start;gap:8px;}
  .side .scn-bar .tag{margin-right:0;}
  .stage-label{font-family:var(--serif);font-size:14px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:4px;}
  @media (max-width:880px){
    .class-grid{grid-template-columns:1fr;}
    .chat{min-height:50vh;max-height:60vh;}
  }

  /* ---------- 报告页：分数 Hero ---------- */
  .hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
  .hero .score-ring{width:120px;height:120px;border-radius:50%;flex:0 0 120px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:conic-gradient(var(--primary) calc(var(--p,0)*1%), var(--primary-soft) 0);
    position:relative;box-shadow:var(--shadow);}
  .hero .score-ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff;}
  .hero .score-ring .num{position:relative;font-family:var(--serif);font-size:34px;font-weight:700;color:var(--ink);line-height:1;}
  .hero .score-ring .den{position:relative;font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .hero .hero-meta{flex:1;min-width:220px;}
  .hero .hero-meta h2{margin-bottom:8px;}
  .rubric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:760px){.rubric-grid{grid-template-columns:1fr;}}
  .cov-grid.report{margin-top:14px;}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">🎓 微格师范生试讲陪练工作台</span>
  <span class="sub">真实角色扮演 · 自动课堂观察 · 量表诊断 · 课标核查</span>
  <span class="spacer"></span>
  <button class="btn ghost sm" id="restartBtn">重新开始</button>
</div>
<div class="wrap" id="root"></div>

<script>
"use strict";
const REGIONS = [
  {k:"①",v:"粤东·陆河县"},{k:"②",v:"粤东·陆丰市"},{k:"③",v:"粤西·阳西县"},
  {k:"④",v:"粤西·阳东区"},{k:"⑤",v:"广州城区（对照组）"},{k:"⑥",v:"自定义"}
];
const CLASS_TYPES = [
  {k:"A",v:"普通班"},{k:"B",v:"乡村小班"},{k:"C",v:"复式教学班"},{k:"D",v:"留守儿童班"}
];
const STUDENTS = {
  xiaoyu:{name:"小宇",role:"学困生 · 16岁",color:"var(--xiaoyu)",gender:"m",char:"熊二"},
  zihan :{name:"子涵",role:"优等生 · 班长 · 17岁",color:"var(--zihan)",gender:"m",char:"孙悟空"},
  haoran:{name:"浩然",role:"调皮生 · 17岁",color:"var(--haoran)",gender:"m",char:"蜡笔小新"},
  siqi  :{name:"思琪",role:"沉默生 · 16岁",color:"var(--siqi)",gender:"f",char:"樱桃小丸子"}
};
const DEMO_CLIENT = {xiaoyu:"老师，我还是不懂……",zihan:"老师，我来！我觉得应该是……",haoran:"哈哈，老师这个我知道！",siqi:"（小声）……是这个意思吗？"};

/* ============ 学段档案：自动按年级调整学生年龄/思维/课前储备/答错率/提问深度/对老师反应 ============
   不同学段的学生在认知水平、课前知识储备、答错常态、提问深度、对老师的反应中差异极大。
   这里固化各学段"最常见"的特征，供系统自动套用，解决"高一和小学水平一样"的违和问题。 */
const GRADE_PROFILES = {
  youer:{ key:"youer", label:"幼儿园", ageBase:6,
    thinking:"以具体形象思维为主，靠实物、图画、游戏理解世界，注意力极短（几分钟），语言稚嫩、句子很短",
    pre:"课前对本课内容基本零储备，完全从零开始，必须老师手把手、反复示范",
    wrong:"很容易答不上来或答非所问，常常凭直觉天真地答，答错很正常，需要老师不断鼓励、降低难度、给提示",
    react:"对老师高度依赖与亲近，老师说啥都信；极少质疑；被批评会委屈但不记仇；常用'老师，为什么呀''我不会，你教我'",
    qdepth:"几乎不主动提问；被问到只会问最表层的'这是什么''为什么要这样'",
    examples:"典型发言：'老师，这个为什么是红色的？''我不懂……''好好玩！''老师你再讲一遍嘛'" },
  xlow:{ key:"xlow", label:"小学低年级(1-2年级)", ageBase:7,
    thinking:"以具体形象思维为主，开始借助实物和例子，注意力较短（约10-15分钟），喜欢游戏化、故事化",
    pre:"课前几乎无本课知识储备，依赖老师用生活例子、直观演示慢慢建立概念",
    wrong:"经常答错或答不完整，需要老师把问题拆小、给提示；但被鼓励后会大胆试",
    react:"崇拜老师、听话，积极参与但易分心；被点名会紧张但努力答；偶有天真反问'老师，为什么呀'",
    qdepth:"提问多为'这是什么''为什么会这样'，问题很浅、很具体，常围绕眼前事物",
    examples:"典型发言：'老师，我见过这个！''是不是这样呀？''我算出来是5！''老师你再讲一遍嘛'" },
  xmid:{ key:"xmid", label:"小学中年级(3-4年级)", ageBase:9,
    thinking:"具体形象向半抽象过渡，能举例、能归纳简单规律，注意力约20分钟，开始有自己的小想法",
    pre:"课前基本无储备，个别预习过一点的能说出一两个词，但大多靠课堂新授",
    wrong:"答错比例仍高，但能说出'我觉得是……因为……'；需要老师纠偏和示范",
    react:"愿意举手但怕答错，被点名会认真答；对老师尊重和依赖，开始有'老师他错了'这类同伴评价意识",
    qdepth:"会问'是不是这样''那如果是别的呢''为什么会这样'，问题开始有'比较/假设'的苗头",
    examples:"典型发言：'老师，我觉得应该是因为……''那如果是3个呢？''他刚才说错了对不对？'" },
  xhigh:{ key:"xhigh", label:"小学高年级(5-6年级)", ageBase:11,
    thinking:"抽象思维萌芽，能理解简单推理、概括规律，能做小结，但仍需老师搭脚手架",
    pre:"课前基本无储备，优等生可能预习了一点、能接上关键词；多数靠课堂新授才懂",
    wrong:"答错减少但仍有，尤其遇到抽象或迁移题会卡住；能自我修正一部分",
    react:"有集体荣誉感，在乎老师评价；会主动追问'那如果……呢'，也开始敢于质疑同伴答案",
    qdepth:"会问'为什么不是这样''有没有别的方法''这个条件能换成别的吗'，出现'质疑/求异'倾向",
    examples:"典型发言：'老师，我有个问题，为什么一定要先算这个？''还有一种方法吧？''他那样算不对吧'" },
  cz:{ key:"cz", label:"初中(7-9年级)", ageBase:13,
    thinking:"抽象逻辑思维快速发展，能推理、能建模，注意力约30分钟，自我意识强、开始叛逆（尤其初二）",
    pre:"课前基本无本课储备，少数预习充分者能提前懂概念；多数要老师讲清才建立",
    wrong:"会答错但能讨论、能自我修正；遇到开放题可能'知道但不精确'；偶尔钻牛角尖",
    react:"对老师既有尊重也有挑战，会质疑'老师你这里是不是讲错了'，爱接话、私下讨论、易走神；被批评易抵触但要面子",
    qdepth:"会问'为什么一定是这样''有没有反例''这和我们之前学的X有什么联系''实际生活中怎么用'",
    examples:"典型发言：'老师，这里是不是应该先……''那如果是负数呢？''我不同意，因为……''这个考不考？'" },
  gz:{ key:"gz", label:"高中(10-12年级)", ageBase:16,
    thinking:"抽象逻辑思维成熟，能进行原理性、系统性思考，能做迁移与综合，注意力较持久",

// 从"小学六年级数学"之类的文本解析出学段档案与派生年龄（小学1→7岁，初中7→13岁，高中10→16岁，统一 age=6+年级）
function parseGrade(str){
  const s=(str||"").trim();
  if(/幼儿园|学前|中班|大班|小班/.test(s)) return Object.assign({},GRADE_PROFILES.youer,{gradeNum:null,ageNum:GRADE_PROFILES.youer.ageBase});
  let m=s.match(/(\d{1,2})\s*年\s*级/);
  let g=m?parseInt(m[1],10):null;
  if(!g){
    if(/高一|高二|高三/.test(s)) g=10+(/高一/.test(s)?0:/高二/.test(s)?1:2);
    else if(/初一|初二|初三/.test(s)) g=7+(/初一/.test(s)?0:/初二/.test(s)?1:2);
    else if(/小一|小二|小三|小四|小五|小六/.test(s)) g=1+(/小一/.test(s)?0:/小二/.test(s)?1:/小三/.test(s)?2:/小四/.test(s)?3:/小五/.test(s)?4:5);
    else if(/小学/.test(s)) g=4;
    else if(/初中/.test(s)) g=8;
    else if(/高中/.test(s)) g=11;
  }
  let p;
  if(g>=1&&g<=2) p=GRADE_PROFILES.xlow;
  else if(g>=3&&g<=4) p=GRADE_PROFILES.xmid;
  else if(g>=5&&g<=6) p=GRADE_PROFILES.xhigh;
  else if(g>=7&&g<=9) p=GRADE_PROFILES.cz;
  else if(g>=10&&g<=12) p=GRADE_PROFILES.gz;
  else p=GRADE_PROFILES.cz;   // 兜底：初中
  const ageNum = g ? (6+g) : p.ageBase;
  return Object.assign({}, p, {gradeNum:g, ageNum});
}

/* ---------------- 学生语音播报（Web Speech API 本地合成，无需联网/密钥） ---------------- */
let soundOn = true;
let zhVoices = [];
let stuVoice = (function(){ try{ return JSON.parse(localStorage.getItem('mt_voices')||'{}'); }catch(e){ return {}; } })();
function saveStuVoices(){ try{ localStorage.setItem('mt_voices', JSON.stringify(stuVoice)); }catch(e){} }
function loadVoices(){
  try{ zhVoices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v=>/zh|cmn|Chinese|Yue|Hakka/i.test(v.lang)||/中文|普通话|国语|粤/i.test(v.name||"")); }catch(e){ zhVoices=[]; }
  refreshVoiceOptions();
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const VOICE_CFG = {
  // 角色化音色：按用户指定的 IP 角色设定 pitch/rate，让四个声音一听可辨。
  // 注：浏览器原生 TTS 没有“蜡笔小新/熊二/孙悟空/樱桃小丸子”这些 IP 角色嗓音，下面参数是「风格化近似」（配合你本机在音色下拉里选到的具体嗓音）。
  xiaoyu:{pitch:0.82, rate:0.84, char:"熊二"},   // 憨厚低沉·慢
  zihan: {pitch:1.38, rate:1.18, char:"孙悟空"},  // 高亢利落·快
  haoran:{pitch:1.55, rate:1.02, char:"蜡笔小新"},// 稚嫩调皮·偏快
  siqi:  {pitch:1.62, rate:0.80, char:"樱桃小丸子"} // 细软轻声·慢
};
// 系统 TTS 无性别字段，按嗓音名启发式推断（仅用于过滤，非 100% 严谨）
function voiceGender(v){
  const n=(v.name||'')+' '+(v.voiceURI||'');
  if(/男|male|boy|亚当|Daniel|David|George|Harry|James|Jason|John|Thomas|Rishi|Yunxi|Kangkang|Kang|云希|康康|晓睿|男声/i.test(n)) return 'm';
  if(/女|female|girl|Alice|Samantha|Victoria|Yue|Zira|Ting|Huihui|Yaoyao|Xiaoxiao|Xiao|Mei|Jia|慧|瑶|晓|婷|雅|女声/i.test(n)) return 'f';
  return '';
}
function pickDefaultVoice(key){
  const g = STUDENTS[key] ? STUDENTS[key].gender : '';
  const good = v=>/neural|online|natural|云|神经|在线/i.test(v.name);
  let pool = g ? zhVoices.filter(v=>voiceGender(v)===g) : zhVoices.slice();
  if(!pool.length) pool = zhVoices.slice();
  return pool.find(good) || pool[0] || null;
}
function refreshVoiceOptions(){
  document.querySelectorAll('.voice-sel').forEach(sel=>{
    const key=sel.dataset.k; const g=STUDENTS[key]?STUDENTS[key].gender:'';
    const prev = stuVoice[key] || sel.value;
    sel.innerHTML='';
    if(!zhVoices.length){
      const o=document.createElement('option'); o.value=''; o.textContent='（无可用中文语音）'; sel.appendChild(o); return;
    }
    // 性别过滤：男孩下拉只列男声，思琪下拉只列女声，从源头杜绝串性别
    let pool = g ? zhVoices.filter(v=>voiceGender(v)===g) : zhVoices.slice();
    let note='';
    if(g && !pool.length){ pool = zhVoices.slice(); note='（本系统未识别到同性别嗓音，已列出全部）'; }
    pool.forEach(v=>{
      const o=document.createElement('option'); o.value=v.name;
      const isGood=/neural|online|natural|云|神经|在线/i.test(v.name);
      o.textContent=v.name+(isGood?' ★':'')+(voiceGender(v)?(' · '+(voiceGender(v)==='f'?'女':'男')):'');
      sel.appendChild(o);
    });
    if(note){ const o=document.createElement('option'); o.value=''; o.textContent=note; o.disabled=true; sel.appendChild(o); }
    if(prev && pool.some(v=>v.name===prev)){ sel.value=prev; stuVoice[key]=prev; }
    else { const d=pickDefaultVoice(key); if(d){ sel.value=d.name; stuVoice[key]=d.name; } }
  });
  saveStuVoices();
}
// 学生发声：把台词压入队列，统一顺序播放。整段（一轮里多名学生的话）期间麦克风只暂停一次、播完才恢复，
// 且每句通过 onend 立即衔接下一句，避免“一名学生说完、下一名隔很久才接”被老师误认为学生停止发问。
function speakStudent(key,text){
  if(!soundOn || !('speechSynthesis' in window) || !text) return;
  const firstEmpty=(speakQ.length===0 && !speakBusy);
  speakQ.push({key,text});
  if(firstEmpty){
    ttsBusy=1;                     // 整段发声开始
    voiceFinal=""; previewVoice("");
    pauseMicForTts();              // 仅整段第一句开始时暂停麦克风
    pumpSpeak();
  }
}
function pumpSpeak(){
  if(speakBusy) return;
  const item=speakQ.shift();
  if(!item) return;
  speakBusy=true;
  try{
    const u=new SpeechSynthesisUtterance(item.text);
    u.lang='zh-CN';
    const cfg=VOICE_CFG[item.key]||{pitch:1,rate:1};
    u.pitch=cfg.pitch; u.rate=cfg.rate;
    // 锁定该角色独立音色；若该嗓音在当前语言下不可用，则在【同性】嗓音内回退，绝不跨性别
    let chosen=null;
    if(stuVoice[item.key]) chosen = zhVoices.find(v=>v.name===stuVoice[item.key]) || null;
    if(!chosen){
      const g=STUDENTS[item.key]?STUDENTS[item.key].gender:'';
      let pool=g?zhVoices.filter(v=>voiceGender(v)===g):zhVoices.slice();
      if(!pool.length) pool=zhVoices.slice();
      chosen=pool.find(v=>/neural|online|natural|云|神经|在线/i.test(v.name))||pool[0]||null;
    }
    if(chosen) u.voice=chosen;
    const fin=()=>{
      speakBusy=false;
      if(speakQ.length){ pumpSpeak(); return; }   // 立刻接下一句，几乎无间隔，麦保持暂停
      // 整段结束：恢复麦克风
      ttsBusy=0;
      voiceFinal=""; voiceLastSpeech=Date.now(); previewVoice("");
      resumeMicAfterTts();
    };
    u.onend=fin; u.onerror=fin;
    speechSynthesis.speak(u);   // 当前句播完才会触发 fin 再播下一句，互不重叠
  }catch(e){ speakBusy=false; if(speakQ.length){ pumpSpeak(); } else { ttsBusy=0; resumeMicAfterTts(); } }
}
// 学生 TTS 发声期间：先真正暂停麦克风（不录音），学生全部说完再立即恢复（重新聆听）
function pauseMicForTts(){ if(voiceActive && recognition){ try{ recognition.stop(); }catch(_){} } }
function resumeMicAfterTts(){ if(voiceActive && recognition){ try{ recognition.start(); }catch(_){} } }
function setSound(on){
  soundOn = on;
  if(!on && 'speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} speakQ=[]; }
  const b=$("#soundBtn"); if(b){ b.textContent = on?"🔊 声音":"🔇 静音"; b.classList.toggle("soft",!on); }
}

/* ---------------- 课堂引擎（前端负责计数，AI负责台词） ---------------- */
function emitStudent(key,text){
  const s=state.students[key];
  s.lastActive=state.log.length; s.distracted=false;
  state.log.push({kind:"student",key,text});
  speakStudent(key,text);   // 学生开口即发声，不只有文字
}
function sysLine(t){state.log.push({kind:"sys",text:t});}

async function teacherTurn(text){
  text=(text||"").trim(); if(!text) return;
  state.log.push({kind:"teacher",text}); renderClassLog();
  await teacherTurnSend(text);
}
async function teacherTurnSend(text){
  text=(text||"").trim(); if(!text) return;
  const isQ=/[?？]|为什么|怎么|想想|谁能|谁来|请举手|对不对|是不是|说说看|想一想|算一算|试一试/.test(text);
  if(isQ) state.questionsCount++;
  state.coldCounter++; if(isQ) state.coldCounter=0;
  updateClassState(text);
  try{
    const data=await api("/api/chat",{scenario:scn(),context:buildContext(),action:"turn",teacherText:text,raiseHand:state.raiseHand,classState:buildClassState(),pptPage:state.pptPage});
    applyResponses(data);
    maybeGotIt();
  }catch(e){ if(String(e.message)!=="unauthorized") sysLine("（网络异常，请重试）"); }
  state.raiseHand=false; syncRaiseHandUI();
}
async function callStudent(key){
  state.roll.total++;
  const s=state.students[key];
  if(state.raiseHand) state.roll.raised++;
  else if(s.distracted) state.roll.distracted++;
  else state.roll.notRaised++;
  s.called=true; s.distracted=false; state.coldCounter=0;
  try{
    const data=await api("/api/chat",{scenario:scn(),context:buildContext(),action:"call:"+key,raiseHand:state.raiseHand,classState:buildClassState(),pptPage:state.pptPage});
    applyResponses(data,key);
  }catch(e){ if(String(e.message)!=="unauthorized") emitStudent(key,DEMO_CLIENT[key]); }
  state.raiseHand=false; syncRaiseHandUI();
}
// 归一化台词用于去重：去空白与句末/句中常见标点，避免“我懂了。”与“我懂了”被判成不同
function normLine(t){ return (t||"").trim().replace(/[\s]+/g,"").replace(/[。.！!？?，,、~～…—\-…]/g,""); }
function applyResponses(data,forcedKey){
  let rs=data&&data.responses||[];
  if(forcedKey && !rs.some(r=>r.student===forcedKey)) rs=[{student:forcedKey,text:DEMO_CLIENT[forcedKey]}].concat(rs);
  // 去重：同一轮内若两名学生台词完全一致（归一化后），只让一人发声，杜绝“两遍一样的话一个先一个后”
  const seen=new Set(); const uniq=[];
  rs.slice(0,2).forEach(r=>{
    if(!STUDENTS[r.student]) return;
    const n=normLine(r.text);
    if(n && seen.has(n)) return;        // 重复台词，跳过（只保留第一个学生）
    if(n) seen.add(n);
    uniq.push(r);
  });
  uniq.forEach(r=>{ emitStudent(r.student,r.text); });
  // 标记"已表达理解"的学生，避免重复触发成长台词
  uniq.forEach(r=>{
    if(STUDENTS[r.student] && /懂了|明白了|我懂|会了|理解了|知道怎么|学会了|搞清楚/.test(r.text) && state.students[r.student].understanding>=55) state.students[r.student].gotIt=true;
  });
  renderClassLog();
  if(data&&data.demo) showBanner("当前为演示占位回复（服务端未配置大模型）。配置 LLM_API_KEY 后即为真实角色扮演。");
}

/* ---------------- 语音输入（麦克风→文字；喊学生名字=点名） ---------------- */
const NAME_MAP=[["小宇","xiaoyu"],["子涵","zihan"],["浩然","haoran"],["思琪","siqi"]];
// 语音识别常把名字转成同音字，这里做容错（仅用双字及以上，避免单字误命中）
const NAME_FUZZY={
  xiaoyu:["小雨","小语","小羽","小禺","小余","小玉"],
  zihan:["子寒","紫涵","梓涵","子函","紫函","梓寒"],
  haoran:["浩冉","昊然","好然","昊冉","皓然"],
  siqi:["思奇","思琦","斯琪","思启","思齐","斯奇"]
};
function detectName(text){
  let matchStr=null, key=null;
  for(const [cn,k] of NAME_MAP){ if(text.indexOf(cn)>=0){ matchStr=cn; key=k; break; } }
  if(!key){
    for(const k of Object.keys(NAME_FUZZY)){
      for(const v of NAME_FUZZY[k]){ if(text.indexOf(v)>=0){ matchStr=v; key=k; break; } }
      if(key) break;
    }
  }
  if(!key) return null;
  const rest=text.replace(matchStr,"").trim();
  // 课堂里常见的“叫人”说法（出现其一即视为点名意图）
  const callIntent=/你来|你回答|你来说|你讲|你答|你上|你做|你写|你读|你算|你背|你说说|回答一下|说说看|你来讲|回答我|你来答|你试试|点\s*名|叫\s*你|起来回答|上讲台|站起来|上黑板|你上来|回答|起来|请\s*你|点\s*你/.test(text);
  if(callIntent || rest.length<=4) return key;
  return null;
}
// 老师不满/批评意图检测：用于让学生"感知老师情绪"。命中关键词即视为有情绪表达
const REP_KEYWORDS=/纪律|安静|别说话|不要吵|别吵|别闹|影响课堂|注意听讲|认真听讲|怎么又|再这样|罚站|站到|后面去|吵闹|收敛|别打扰|听我讲|安静点|别插嘴|别打断|坐好|专心|别开小差|别走神|不要太|上课了|别玩|太吵|别讲话|听不进去|给我|不像话/;
function detectReprimand(text){
  if(!REP_KEYWORDS.test(text)) return null;
  let key=null;
  for(const [cn,k] of NAME_MAP){ if(text.indexOf(cn)>=0){ key=k; break; } }
  if(!key){
    for(const k of Object.keys(NAME_FUZZY)){ for(const v of NAME_FUZZY[k]){ if(text.indexOf(v)>=0){ key=k; break; } } if(key) break; }
  }
  return { key:key||null, generic:!key };
}
// 每回合老师讲话后更新课堂状态：课节推进、记录批评、推进理解度
function updateClassState(text){
  state.lessonTurn++;
  const rep=detectReprimand(text);
  if(rep){
    state.teacherDispleasure++;
    if(rep.key){
      state.students[rep.key].reprimands++;
      state.lastReprimandKey=rep.key;
      state.lastReprimandTurn=state.lessonTurn;
    }
  }
  // 理解度随教学推进上升（小宇慢、子涵快）；被批评者当回合略降 engagement
  let growth={xiaoyu:rep?1:4, zihan:rep?1:3, haoran:rep?0:3, siqi:rep?1:3};
  if(rep&&rep.key) growth[rep.key]=Math.max(0,(growth[rep.key]||0)-2);
  for(const k in state.students){
    const g=growth[k]||2;
    state.students[k].understanding=Math.min(100,(state.students[k].understanding||0)+g);
  }
}
// 把当前课堂状态打包传给后端，让 LLM 看到成长与情绪

}
// 当小宇理解度越过阈值但 LLM 本轮没让他说"懂了"时，自然补一句，体现"教会了她们"

let recognition=null, voiceActive=false, voiceFinal="", voiceReady=false;
let ttsBusy=0;   // 学生 TTS 正在播报的“整段”计数；>0 时真正暂停麦克风（不录音），整段全部播完才恢复，杜绝录到系统自己发出的声音

// PPT 翻页意图识别（不停止聆听，仅返回翻页指令）
const CN_NUM={零:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
function cn2int(s){
  if(/^[0-9]+$/.test(s)) return parseInt(s,10);
  if(s==="十") return 10;
  if(s.length===2){ if(s[0]==="十") return 10+(CN_NUM[s[1]]||0); if(s[1]==="十") return (CN_NUM[s[0]]||0)*10; }
  if(s.length===3 && s[1]==="十") return (CN_NUM[s[0]]||0)*10+(CN_NUM[s[2]]||0);
  return CN_NUM[s[0]]||0;
}
function detectPptNav(text){
  let m=text.match(/第\s*([0-9]+)\s*[页张]/);
  if(m) return { kind:"goto", page:parseInt(m[1],10), matched:m[0] };
  m=text.match(/第\s*([一二三四五六七八九十两]+)\s*[页张]/);
  if(m) return { kind:"goto", page:cn2int(m[1]), matched:m[0] };
  m=text.match(/下一页|翻到下一页|翻下一页|下一张|往后翻|往后一页|进下一页|翻篇|下页/);
  if(m) return { kind:"next", matched:m[0] };
  m=text.match(/上一页|前一页|翻到上一页|前一张|往前翻|往前一页|退上一页|翻回去|上页/);
  if(m) return { kind:"prev", matched:m[0] };
  return null;
}
// 手动翻页（按钮）
function navPpt(delta){
  let p=state.pptPage+delta;
  if(state.pptTotal && p>state.pptTotal) p=state.pptTotal;
  if(p<1) p=1;
  state.pptPage=p; updatePptIndicator();
  sysLine("（PPT 翻到第 "+p+(state.pptTotal?(" / "+state.pptTotal):"")+" 页）");
}
function updatePptIndicator(){
  const el=$("#pptPage"); if(el) el.textContent="第 "+state.pptPage+(state.pptTotal?(" / "+state.pptTotal):"")+" 页";
}
function applyPptNav(nav){
  let p = nav.kind==="goto" ? nav.page : (nav.kind==="next" ? state.pptPage+1 : Math.max(1,state.pptPage-1));
  if(state.pptTotal && p>state.pptTotal) p=state.pptTotal;
  if(p<1) p=1;
  state.pptPage=p; updatePptIndicator();
  sysLine("（PPT 翻到第 "+p+(state.pptTotal?(" / "+state.pptTotal):"")+" 页）");
  // 从累积缓冲中移除翻页词，避免下一句识别重复触发
  if(nav.matched) voiceFinal=voiceFinal.split(nav.matched).join("");
}

// 老师说「点一个人 / 抽一个同学 / 我点一个」等（未指定具体谁）→ 视为要随机点名
function detectCallSomeone(text){
  if(!text||!text.trim()) return false;
  return /点\s*一\s*个\s*人|点\s*个\s*人|点\s*一?\s*个\s*同学|抽\s*一\s*个|抽\s*一?\s*个\s*同学|请\s*一?\s*位\s*同学|谁\s*来\s*回?\s*答|哪\s*位\s*同\s*学|喊\s*一?\s*个\s*同学|叫\s*一?\s*个\s*同学|随\s*便\s*点\s*一\s*个|我\s*点\s*一\s*个|我\s*抽\s*一\s*个|点\s*一?\s*下\s*名/.test(text);
}
// 老师要「点一个人」时，浩然偶尔（约 35% 且非连续）调皮插嘴说"别点我"，不回回这样
function maybeHaoranNaughty(){
  if(state.lastHaoranNaughtyTurn && (state.lessonTurn - state.lastHaoranNaughtyTurn) < 2) return;
  if(Math.random() >= 0.35) return;
  state.lastHaoranNaughtyTurn = state.lessonTurn;
  const lines=[

function setupVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ voiceReady=false; const h=$("#micHint"); if(h) h.textContent="当前浏览器不支持语音输入（请使用 Chrome / Edge）。可继续用键盘输入。"; const mb=$("#micBtn"); if(mb) mb.style.display="none"; return; }
  try{
    recognition=new SR();
    recognition.lang="zh-CN";
    recognition.continuous=true;       // 整节课常开：不因一次停顿/思考就结束
    recognition.interimResults=true;   // 实时显示识别中文字，老师能看到当前识别
    recognition.maxAlternatives=1;
    recognition.onresult=(ev)=>{
      if(ttsBusy>0){ voiceFinal=""; previewVoice(""); return; }  // 学生正在发声 → 屏蔽，绝不把系统声音当老师发言
      let interim="", hasContent=false;
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const r=ev.results[i];
        if(r.isFinal){ if((r[0].transcript||"").trim()) hasContent=true; voiceFinal+=r[0].transcript; }
        else interim+=r[0].transcript;
      }
      if(hasContent || (interim&&interim.trim())) voiceLastSpeech=Date.now();
      previewVoice(interim);
      if(!voiceFinal.trim()) return;
      if(!voiceChunkStart) voiceChunkStart=Date.now();   // 标记本次发言起始时刻（用于语速统计）
      // 翻页指令——仅更新页码，不发送、不停止聆听
      const nav=detectPptNav(voiceFinal);
      if(nav){ applyPptNav(nav); }
      // 直接喊学生名字 → 立即让该生回应（视为点名），不等 3 秒
      const callKey=detectName(voiceFinal);
      if(callKey){ autoSend("call",callKey); return; }
      // 老师说「点一个人 / 抽一个同学」→ 立即发送，浩然偶尔调皮一下
      if(detectCallSomeone(voiceFinal)){ autoSend("callsomeone"); return; }
      // 其余情况：仅当师范生停止说话满 2 秒后（见 checkVoiceSilence）才自动定稿发送
    };
    recognition.onerror=(e)=>{
      if(!e) return;
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){ stopVoice(); return; }
      // 非致命错误（no-speech / aborted / network 短暂中断等）尝试继续聆听，避免"讲着突然不翻译"
      // 但若学生正在发声（ttsBusy>0），恢复交给 resumeMicAfterTts，避免与暂停逻辑抢麦
      if(voiceActive && ttsBusy===0){ setTimeout(()=>{ if(voiceActive && ttsBusy===0){ try{ recognition.start(); }catch(_){} } }, 150); }
    };
    recognition.onend=()=>{
      // 学生正在发声（我们主动 stop）→ 不重启，等学生说完 resumeMicAfterTts 再恢复
      if(voiceActive && ttsBusy===0){ setTimeout(()=>{ if(voiceActive && ttsBusy===0){ try{ recognition.start(); }catch(_){} } }, 150); }
      else if(!voiceActive){ setMicUI(false); }
    };
    voiceReady=true;
    const h=$("#micHint"); if(h) h.textContent="🎤 语音为「整节课常开」模式：点 🎤 开讲后麦克风一直聆听，当你停止说话满 2 秒，系统会自动把刚才说的话定稿发送并继续听；直接喊学生名字或说「点一个人」会立即让该生回应。无需反复切后台。说“下一页 / 翻到第3页”会自动翻 PPT。再点 🎤（或下课）才停止。";
  }catch(e){ voiceReady=false; }
}
function previewVoice(interim){
  const ti=$("#teacherInput"); if(!ti) return;
  ti.value=voiceFinal+(interim?"　"+interim:"");
}
function setMicUI(on){ const mb=$("#micBtn"); if(mb){ mb.classList.toggle("mic-on",on); mb.textContent=on?"⏹ 聆听中（常开）":"🎤"; } const ti=$("#teacherInput"); if(ti) ti.classList.toggle("listening",on); }
function toggleVoice(){
  if(!voiceReady||!recognition){ alert("当前浏览器不支持语音输入，请改用键盘，或使用 Chrome / Edge 浏览器。"); return; }
  if(voiceActive){ stopVoice(); return; }   // 手动停止（关麦，不发送残留）
  voiceActive=true; voiceFinal=""; voiceLastSpeech=Date.now();
  const ti=$("#teacherInput"); if(ti) ti.value="";
  try{ recognition.start(); setMicUI(true); }catch(e){ voiceActive=false; setMicUI(false); }
  if(voiceSilenceTimer) clearInterval(voiceSilenceTimer);
  voiceSilenceTimer=setInterval(checkVoiceSilence,1000);
  if(voiceAliveTimer) clearInterval(voiceAliveTimer);
  voiceAliveTimer=setInterval(checkVoiceAlive,2000);   // 看门狗：识别意外停止则自动续听
}
// 常开发送：发出当前内容后清空缓冲、重置计时，但保持聆听（麦克风不关）
function autoSend(kind,key){
  const text=voiceFinal.trim();
  if(!text) return;
  // 采集语速指标：本次发言有效时长 ≈ 末次识别内容时刻 - 发言起始时刻；累计字数与时长
  if(voiceChunkStart && text.length>=2){
    const dur=voiceLastSpeech - voiceChunkStart;
    if(dur>200){ state.voice.chars+=text.length; state.voice.speakingMs+=dur; }
  }
  voiceChunkStart=0;
  voiceFinal=""; voiceLastSpeech=Date.now();   // 准备接收下一句，麦继续开
  state.log.push({kind:"teacher",text}); renderClassLog();
  if(kind==="call"){ sysLine("（语音识别：老师点名「"+STUDENTS[key].name+"」，自动发送并继续聆听）"); callStudent(key); return; }
  if(kind==="callsomeone"){ sysLine("（语音识别：老师要『点一个人』，自动发送并继续聆听）"); teacherTurnSend(text); maybeHaoranNaughty(); return; }
  sysLine("（语音识别：老师停止说话约 2 秒，自动定稿发送并继续聆听）");
  teacherTurnSend(text);
}
// 真正关麦（下课 / 重新选场景 / 手动关闭 🎤）
function stopVoice(){
  voiceActive=false;
  if(voiceSilenceTimer){ clearInterval(voiceSilenceTimer); voiceSilenceTimer=null; }
  if(voiceAliveTimer){ clearInterval(voiceAliveTimer); voiceAliveTimer=null; }
  speakQ=[]; speakBusy=false;
  try{ recognition.stop(); }catch(e){}
  setMicUI(false);
  voiceFinal="";
  const ti=$("#teacherInput"); if(ti) ti.value="";
}
function checkVoiceSilence(){
  if(!voiceActive) return;
  if(ttsBusy>0) return;                          // 学生正在发声，不发送
  if(!voiceFinal.trim()) return;                 // 还没说任何内容，不发送
  if(Date.now()-voiceLastSpeech >= VOICE_SILENCE_MS) autoSend();
}
// 看门狗：部分浏览器连续识别会无声结束（onend 偶发未触发），周期性检测 state 并续听
function checkVoiceAlive(){
  if(!voiceActive||!recognition) return;
  if(ttsBusy>0) return;   // 学生发声期间麦克风本就该停，看门狗不要强行重启
  try{ if(recognition.state && recognition.state==="inactive"){ recognition.start(); } }catch(_){}
}
function renderClassLog(){
  const chat=$("#chat"); if(!chat) return;
  chat.innerHTML="";
  state.log.forEach(m=>{
    if(m.kind==="sys"){ const d=document.createElement("div"); d.className="sys"; d.textContent=m.text; chat.appendChild(d); return; }
    const row=document.createElement("div");
    row.className="row "+(m.kind==="teacher"?"teacher":"student");

}

    h1{font-family:"Songti SC","STSong","SimSun",serif;color:#23201b;letter-spacing:1px;border-left:6px solid #9c6b3f;padding-left:14px}
    h2{font-family:"Songti SC","STSong","SimSun",serif;color:#9c6b3f;border-bottom:1px solid #e4ddcf;padding-bottom:6px;margin-top:28px}
    .score{font-family:"Songti SC",serif;font-size:30px;color:#9c6b3f}
    .m{margin:6px 0} .ok{color:#5f7d4f;font-weight:600} .bad{color:#b14a3a;font-weight:600}
    .foot{color:#8a6d3b;font-size:12px;margin-top:24px}
  </style></head><body><div class="wrap">
  <h1>微格试讲诊断报告</h1><p>场景：${esc(regionLabel())} ｜ ${esc(state.gradeSubject||"未指定")} ｜ ${esc(classLabel())}</p>
  <h2>一、课堂观察</h2><p>${esc(obsFull)}</p>
  <p>提问次数：${state.questionsCount}；冷场走神次数：${state.distractedMoments}；语音语速估算：${esc(voiceCpmText())}</p>
  <h2>二、量表诊断（总分 <span class="score">${total}</span>/100）</h2>
  ${rubric.map(it=>`<p class="m"><b>${esc(it.name)}</b>：${it.score}/20 — ${esc(it.comment||"")}</p>`).join("")}
  <h2>三、课标覆盖核查</h2>
  <p>${cov.covered.map(c=>'<span class="ok">✓ '+esc(c)+'</span>').join("； ")}${cov.missing.length?"； "+cov.missing.map(c=>'<span class="bad">✗ '+esc(c)+'</span>').join("； "):""}</p>
  ${cov.comment?`<p>${esc(cov.comment)}</p>`:""}
  <h2>四、综合建议</h2><p>${(data.overall||[]).map(s=>"· "+esc(s)).join("<br/>")||"无"}</p>
  ${prep?`<h2>五、备课充分度评测（${prep.score}/20）</h2>
  ${Object.entries(prep.aspects||{}).map(([k,v])=>`<p class="m"><b>${esc(k)}</b>：${v}/5</p>`).join("")}
  <p>${esc(prep.comment||"")}</p>`:""}
  <h2>六、师范生课后自评与反思诊断</h2>
  <p><b>是否提交课后自评：</b>${data.selfReflect&&data.selfReflect.used?'已提交':'未提交'}</p>
  ${data.selfReflect&&data.selfReflect.used?`
  <p><b>师范生自评原文：</b>${esc(data.selfReflect.teacherSaid||"")}</p>
  <p><b>反思质量评价：</b>${esc(data.selfReflect.eval||"")}</p>
  ${data.selfReflect.note?`<p>${esc(data.selfReflect.note)}</p>`:""}`:`
  <p class="bad">${esc((data.selfReflect&&data.selfReflect.note)||"师范生未提交课后自评，未体现反思意识，教学反思维度按弱项处理。")}</p>`}
  <p class="foot">由「微格师范生试讲陪练工作台」生成。</p></div></body></html>`;
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="试讲诊断报告.html"; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------------- 重置 / 启动 ---------------- */
function resetState(){
  state.phase="select"; state.region=""; state.customRegion=""; state.gradeSubject="";
  state.classType=""; state.raiseHand=false; state.coldCounter=0;
  state.lessonTurn=0; state.teacherDispleasure=0; state.lastReprimandKey=null; state.lastReprimandTurn=0;
  state.students={xiaoyu:{called:false,distracted:false,lastActive:-1,understanding:25,reprimands:0,gotIt:false},zihan:{called:false,distracted:false,lastActive:-1,understanding:70,reprimands:0,gotIt:false},haoran:{called:false,distracted:false,lastActive:-1,understanding:55,reprimands:0,gotIt:false},siqi:{called:false,distracted:false,lastActive:-1,understanding:60,reprimands:0,gotIt:false}};
  state.roll={total:0,raised:0,notRaised:0,distracted:0};
  state.log=[]; state.questionsCount=0; state.distractedMoments=0; state.transcript=""; state.covered={}; state.lastScore=null; state.lessonPlanText=""; state.lessonPlanName="";
  state.selfReflect=""; state.voice={ chars:0, speakingMs:0 };
  state.pptName=""; state.pptTotal=0; state.pptPage=1;
}
$("#restartBtn").onclick=()=>{ if(confirm("确定要重新开始吗？当前演练数据将清空。")){ resetState(); renderSelect(); } };

async function boot(){
  try{ const st=await fetch("/api/status").then(r=>r.json()); HAS_LLM=!!st.hasLLM;
    if(st.needsPasscode){ PASSCODE=""; showPasscode(); return; }
  }catch(e){ /* 默认 true，继续 */ }
  renderSelect();
}
boot();
</script>
